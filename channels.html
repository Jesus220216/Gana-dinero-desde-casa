<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canales - Plataforma de Monetización</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .header h1 {
      font-size: 28px;
      color: #a855f7;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
    }

    .btn-secondary {
      background: rgba(168, 85, 247, 0.2);
      color: #a855f7;
      border: 1px solid #a855f7;
    }

    .btn-secondary:hover {
      background: rgba(168, 85, 247, 0.3);
    }

    .channels-section h2 {
      margin-bottom: 20px;
      color: #a855f7;
      font-size: 24px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .channel-card {
      border-radius: 12px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .channel-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
    }

    .channel-header {
      padding: 20px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      text-align: center;
    }

    .channel-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .channel-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .channel-email {
      font-size: 12px;
      opacity: 0.8;
    }

    .channel-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .channel-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat {
      text-align: center;
      padding: 10px;
      background: rgba(168, 85, 247, 0.1);
      border-radius: 6px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #a855f7;
    }

    .stat-label {
      font-size: 12px;
      color: #cbd5e1;
    }

    .channel-description {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 15px;
      flex: 1;
    }

    .channel-actions {
      display: flex;
      gap: 10px;
    }

    .btn-subscribe {
      flex: 1;
      padding: 10px;
      background: #22c55e;
      color: black;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-subscribe:hover {
      background: #16a34a;
    }

    .btn-subscribe.subscribed {
      background: #38bdf8;
      color: black;
    }

    .btn-view {
      flex: 1;
      padding: 10px;
      background: #38bdf8;
      color: black;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-view:hover {
      background: #0284c7;
    }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: #cbd5e1;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(168, 85, 247, 0.3);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .payment-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .payment-modal.active {
      display: flex;
    }

    .payment-modal-content {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      max-width: 500px;
      width: 90%;
      padding: 30px;
      position: relative;
    }

    .payment-modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #ef4444;
      cursor: pointer;
      background: none;
      border: none;
    }

    .payment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .payment-option {
      padding: 15px;
      border: 2px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .payment-option:hover {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.1);
    }

    .payment-option.selected {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }

    #paypal-button-container {
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .header-actions {
        width: 100%;
        flex-direction: column;
      }

      .channels-grid {
        grid-template-columns: 1fr;
      }

      .payment-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎬 Canales</h1>
    <div class="header-actions">
      <a href="home_v2.html" class="btn btn-secondary">🏠 Inicio</a>
      <a href="dashboard_v2.html" class="btn btn-primary">📊 Mi Dashboard</a>
    </div>
  </div>

  <div id="alertContainer"></div>

  <div class="channels-section">
    <h2>📺 Creadores Disponibles</h2>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Cargando canales...</p>
    </div>
    <div class="channels-grid" id="channelsGrid"></div>
    <div class="empty-message" id="emptyMessage" style="display:none;">
      <p>No hay canales disponibles en este momento.</p>
    </div>
  </div>

</div>

<!-- MODAL DE PAGO -->
<div class="payment-modal" id="paymentModal">
  <div class="payment-modal-content">
    <button class="payment-modal-close" onclick="closePaymentModal()">&times;</button>
    <h2 style="color: #a855f7; margin-bottom: 20px;">💳 Suscribirse a Canal</h2>
    <p style="color: #cbd5e1; margin-bottom: 20px;">Precio: <strong>$9.99 USD / Mes</strong></p>
    
    <div class="payment-options">
      <div class="payment-option" onclick="selectPaymentMethod('paypal')">
        <div style="font-size: 24px; margin-bottom: 5px;">🅿️</div>
        <div>PayPal</div>
      </div>
      <div class="payment-option" onclick="selectPaymentMethod('stripe')">
        <div style="font-size: 24px; margin-bottom: 5px;">💳</div>
        <div>Tarjeta</div>
      </div>
    </div>

    <div id="paypal-button-container" style="display: none;"></div>
    <div id="stripe-payment" style="display: none;">
      <input type="email" id="stripeEmail" placeholder="tu@email.com" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #a855f7; background: rgba(30, 41, 59, 0.8); color: white;">
      <button class="btn btn-primary" onclick="processStripePayment()" style="width: 100%;">Pagar con Tarjeta</button>
    </div>

    <button class="btn btn-secondary" onclick="closePaymentModal()" style="width: 100%; margin-top: 15px;">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgJITFOGXw-r5KYzz1zHlNz1jKw-_XMwM",
  authDomain: "monetizacion-pro.firebaseapp.com",
  projectId: "monetizacion-pro",
  storageBucket: "monetizacion-pro.appspot.com",
  messagingSenderId: "580361577178",
  appId: "1:580361577178:web:b86b0a8301e94b93997be3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const channelsGrid = document.getElementById("channelsGrid");
const loading = document.getElementById("loading");
const emptyMessage = document.getElementById("emptyMessage");
const alertContainer = document.getElementById("alertContainer");
const paymentModal = document.getElementById("paymentModal");

let currentUser = null;
let selectedCreatorId = null;
let selectedPaymentMethod = null;
let config = null;

function showAlert(message, type = "info") {
  const alert = document.createElement("div");
  alert.className = `alert ${type} show`;
  alert.textContent = message;
  alertContainer.appendChild(alert);
  
  setTimeout(() => {
    alert.remove();
  }, 4000);
}

async function loadConfig() {
  try {
    const response = await fetch("/api/config");
    const data = await response.json();
    if (data.ok) {
      config = data.config;
      loadPayPalSDK(config.paypalClientId);
    }
  } catch (e) {
    console.error("Error cargando config:", e);
  }
}

function loadPayPalSDK(clientId) {
  if (window.paypal) return;
  
  const script = document.createElement("script");
  script.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD`;
  script.onload = () => initPayPalButton();
  document.head.appendChild(script);
}

window.selectPaymentMethod = (method) => {
  selectedPaymentMethod = method;
  
  document.querySelectorAll(".payment-option").forEach(el => {
    el.classList.remove("selected");
  });
  event.target.closest(".payment-option").classList.add("selected");
  
  document.getElementById("paypal-button-container").style.display = method === "paypal" ? "block" : "none";
  document.getElementById("stripe-payment").style.display = method === "stripe" ? "block" : "none";
  
  if (method === "paypal") {
    initPayPalButton();
  }
};

function initPayPalButton() {
  if (!window.paypal) return;
  
  const container = document.getElementById("paypal-button-container");
  if (container.querySelector("iframe")) return;
  
  paypal.Buttons({
    createOrder: (data, actions) => {
      return actions.order.create({
        purchase_units: [{
          amount: { value: config ? config.vipPrice : "9.99" }
        }]
      });
    },
    onApprove: async (data, actions) => {
      const order = await actions.order.capture();
      
      try {
        const response = await fetch("/api/subscribe-channel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            subscriberId: currentUser.uid,
            creatorId: selectedCreatorId,
            orderId: order.id,
            paymentMethod: "paypal"
          })
        });

        const result = await response.json();
        if (result.ok) {
          showAlert("¡Suscripción exitosa! Ahora puedes ver el contenido exclusivo.", "success");
          closePaymentModal();
          loadChannels();
        } else {
          showAlert("Error: " + result.error, "error");
        }
      } catch (error) {
        showAlert("Error: " + error.message, "error");
      }
    },
    onError: (err) => {
      console.error("Error en PayPal:", err);
      showAlert("Error en el pago. Por favor intenta de nuevo.", "error");
    }
  }).render("#paypal-button-container");
}

window.processStripePayment = async () => {
  const email = document.getElementById("stripeEmail").value;
  if (!email) {
    showAlert("Por favor ingresa tu email", "error");
    return;
  }
  
  showAlert("Integración de Stripe en desarrollo. Usa PayPal por ahora.", "info");
};

async function checkSubscription(userId, creatorId) {
  try {
    const response = await fetch(`/api/check-subscription/${userId}/${creatorId}`);
    const data = await response.json();
    return data.ok && data.subscribed;
  } catch (error) {
    return false;
  }
}

async function loadChannels() {
  loading.style.display = "block";
  channelsGrid.innerHTML = "";
  
  try {
    const usersSnap = await getDocs(collection(db, "users"));
    const creators = [];

    for (const userDoc of usersSnap.docs) {
      const userData = userDoc.data();
      
      if (userDoc.id === "owner" || userDoc.id === currentUser?.uid) continue;

      const statsResponse = await fetch(`/api/user-stats/${userDoc.id}`);
      const statsData = await statsResponse.json();

      if (statsData.ok) {
        creators.push({
          id: userDoc.id,
          email: userData.email,
          balance: userData.balance || 0,
          stats: statsData.stats
        });
      }
    }

    if (creators.length === 0) {
      emptyMessage.style.display = "block";
    } else {
      emptyMessage.style.display = "none";
      
      for (const creator of creators) {
        const isSubscribed = currentUser ? await checkSubscription(currentUser.uid, creator.id) : false;
        const card = document.createElement("div");
        card.className = "channel-card";
        
        const initials = creator.email.substring(0, 2).toUpperCase();

        card.innerHTML = `
          <div class="channel-header">
            <div class="channel-avatar">${initials}</div>
            <div class="channel-name">${creator.email.split('@')[0]}</div>
            <div class="channel-email">${creator.email}</div>
          </div>
          <div class="channel-body">
            <div class="channel-stats">
              <div class="stat">
                <div class="stat-value">${creator.stats.subscribers}</div>
                <div class="stat-label">Suscriptores</div>
              </div>
              <div class="stat">
                <div class="stat-value">${creator.stats.contentCount}</div>
                <div class="stat-label">Videos</div>
              </div>
            </div>
            <div class="channel-description">
              Creador de contenido exclusivo. Suscríbete para acceder a todo su contenido privado.
            </div>
            <div class="channel-actions">
              <button class="btn-view" onclick="viewChannel('${creator.id}')">👁️ Ver Canal</button>
              <button class="btn-subscribe ${isSubscribed ? 'subscribed' : ''}" 
                onclick="subscribeToChannel('${creator.id}')">
                ${isSubscribed ? '✓ Suscrito' : '+ Suscribirse'}
              </button>
            </div>
          </div>
        `;
        
        channelsGrid.appendChild(card);
      }
    }
  } catch (error) {
    console.error(error);
    showAlert("Error al cargar canales: " + error.message, "error");
  } finally {
    loading.style.display = "none";
  }
}

window.viewChannel = (creatorId) => {
  window.location.href = `channel.html?id=${creatorId}`;
};

window.subscribeToChannel = (creatorId) => {
  if (!currentUser) {
    showAlert("Debes iniciar sesión para suscribirte", "error");
    window.location.href = "dashboard_v2.html";
    return;
  }

  selectedCreatorId = creatorId;
  selectedPaymentMethod = null;
  paymentModal.classList.add("active");
};

window.closePaymentModal = () => {
  paymentModal.classList.remove("active");
  selectedCreatorId = null;
  selectedPaymentMethod = null;
  document.querySelectorAll(".payment-option").forEach(el => {
    el.classList.remove("selected");
  });
  document.getElementById("paypal-button-container").style.display = "none";
  document.getElementById("stripe-payment").style.display = "none";
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    loadChannels();
  } else {
    emptyMessage.style.display = "block";
    emptyMessage.innerHTML = "<p>Debes <a href='dashboard_v2.html' style='color: #a855f7;'>iniciar sesión</a> para ver los canales.</p>";
  }
});

loadConfig();
</script>

</body>
</html>
