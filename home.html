<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Pública - Plataforma de Monetización</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .header h1 {
      font-size: 28px;
      color: #a855f7;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
    }

    .btn-secondary {
      background: rgba(168, 85, 247, 0.2);
      color: #a855f7;
      border: 1px solid #a855f7;
    }

    .btn-secondary:hover {
      background: rgba(168, 85, 247, 0.3);
    }

    /* GALLERY */
    .gallery-section h2 {
      margin-bottom: 20px;
      color: #a855f7;
      font-size: 24px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
    }

    .gallery-item-media {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .gallery-item-info {
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
    }

    .gallery-item-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #a855f7;
    }

    .gallery-item-description {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .gallery-item-stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .gallery-item-action {
      display: flex;
      gap: 10px;
    }

    .btn-small {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-view {
      background: #22c55e;
      color: black;
    }

    .btn-view:hover {
      background: #16a34a;
    }

    .btn-comments {
      background: #38bdf8;
      color: black;
    }

    .btn-comments:hover {
      background: #0284c7;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #ef4444;
      cursor: pointer;
      background: none;
      border: none;
    }

    .modal-close:hover {
      color: #dc2626;
    }

    .modal-media {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #a855f7;
      margin-bottom: 10px;
    }

    .modal-description {
      color: #cbd5e1;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .modal-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(168, 85, 247, 0.1);
      border-radius: 8px;
    }

    .modal-stat {
      text-align: center;
    }

    .modal-stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #a855f7;
    }

    .modal-stat-label {
      font-size: 12px;
      color: #cbd5e1;
    }

    /* COMMENTS */
    .comments-section {
      margin-top: 20px;
      border-top: 1px solid rgba(168, 85, 247, 0.3);
      padding-top: 20px;
    }

    .comments-section h3 {
      color: #a855f7;
      margin-bottom: 15px;
    }

    .comment-form {
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(168, 85, 247, 0.1);
      border-radius: 8px;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 4px;
      background: rgba(30, 41, 59, 0.8);
      color: white;
      font-family: inherit;
    }

    .comment-form textarea {
      resize: vertical;
      min-height: 80px;
    }

    .comment-form button {
      background: #22c55e;
      color: black;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .comment-form button:hover {
      background: #16a34a;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .comment {
      padding: 15px;
      background: rgba(30, 41, 59, 0.8);
      border-left: 3px solid #a855f7;
      border-radius: 4px;
    }

    .comment-author {
      font-weight: bold;
      color: #a855f7;
      margin-bottom: 5px;
    }

    .comment-text {
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .comment-date {
      font-size: 12px;
      color: #64748b;
    }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: #cbd5e1;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(168, 85, 247, 0.3);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .header-actions {
        width: 100%;
        flex-direction: column;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }

      .modal-content {
        width: 95%;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>🎬 Galería Pública</h1>
    <div class="header-actions">
      <a href="home_v2.html" class="btn btn-secondary">🏠 Inicio</a>
      <a href="dashboard_v2.html" class="btn btn-primary">💳 Obtén VIP</a>
    </div>
  </div>

  <!-- ALERT -->
  <div id="alertContainer"></div>

  <!-- GALLERY SECTION -->
  <div class="gallery-section">
    <h2>📺 Contenido Disponible</h2>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Cargando contenido...</p>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="empty-message" id="emptyMessage" style="display:none;">
      <p>No hay contenido disponible en este momento.</p>
    </div>
  </div>

</div>

<!-- MODAL PARA VER DETALLES -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgJITFOGXw-r5KYzz1zHlNz1jKw-_XMwM",
  authDomain: "monetizacion-pro.firebaseapp.com",
  projectId: "monetizacion-pro",
  storageBucket: "monetizacion-pro.appspot.com",
  messagingSenderId: "580361577178",
  appId: "1:580361577178:web:b86b0a8301e94b93997be3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DOM Elements
const gallery = document.getElementById("gallery");
const loading = document.getElementById("loading");
const emptyMessage = document.getElementById("emptyMessage");
const alertContainer = document.getElementById("alertContainer");
const detailModal = document.getElementById("detailModal");

// Generar ID de usuario anónimo
let userId = localStorage.getItem('uid');
if (!userId) {
  userId = 'user_' + Math.random().toString(36).substr(2, 9);
  localStorage.setItem('uid', userId);
}

// Mostrar alerta
function showAlert(message, type = "info") {
  const alert = document.createElement("div");
  alert.className = `alert ${type} show`;
  alert.textContent = message;
  alertContainer.appendChild(alert);
  
  setTimeout(() => {
    alert.remove();
  }, 4000);
}

// Cargar galería pública
async function loadPublicGallery() {
  loading.style.display = "block";
  gallery.innerHTML = "";
  
  try {
    const snap = await getDocs(query(collection(db, "media"), where("isPublic", "==", true)));
    
    if (snap.empty) {
      emptyMessage.style.display = "block";
      loading.style.display = "none";
      return;
    }
    
    emptyMessage.style.display = "none";
    
    snap.forEach(doc => {
      const data = doc.data();
      const item = document.createElement("div");
      item.className = "gallery-item";
      
      let mediaHTML = '';
      if (data.type && data.type.startsWith("image")) {
        mediaHTML = `<img src="${data.url}" alt="${data.title}" class="gallery-item-media">`;
      } else if (data.type && data.type.startsWith("video")) {
        mediaHTML = `<video class="gallery-item-media" controls><source src="${data.url}"></video>`;
      }
      
      item.innerHTML = `
        ${mediaHTML}
        <div class="gallery-item-info">
          <div class="gallery-item-title">${data.title || 'Sin título'}</div>
          <div class="gallery-item-description">${data.description || 'Sin descripción'}</div>
          <div class="gallery-item-stats">
            <div class="stat">👁️ ${data.views || 0} visitas</div>
            <div class="stat">💬 ${data.commentsCount || 0} comentarios</div>
          </div>
          <div class="gallery-item-action">
            <button class="btn-small btn-view" onclick="viewDetails('${doc.id}')">Ver Detalles</button>
            <button class="btn-small btn-comments" onclick="viewComments('${doc.id}')">Comentarios</button>
          </div>
        </div>
      `;
      
      gallery.appendChild(item);
    });
  } catch (error) {
    showAlert("Error al cargar la galería: " + error.message, "error");
  } finally {
    loading.style.display = "none";
  }
}

// Ver detalles del contenido
window.viewDetails = async (mediaId) => {
  try {
    const docRef = doc(db, "media", mediaId);
    const docSnap = await getDoc(docRef);
    
    if (!docSnap.exists()) {
      showAlert("Contenido no encontrado", "error");
      return;
    }
    
    const data = docSnap.data();
    
    // Incrementar visitas
    try {
      await fetch("/api/increment-views", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mediaId })
      });
    } catch (e) {
      console.log("No se pudo incrementar visitas");
    }
    
    let mediaHTML = '';
    if (data.type && data.type.startsWith("image")) {
      mediaHTML = `<img src="${data.url}" alt="${data.title}" class="modal-media">`;
    } else if (data.type && data.type.startsWith("video")) {
      mediaHTML = `<video class="modal-media" controls><source src="${data.url}"></video>`;
    }
    
    const modalBody = document.getElementById("modalBody");
    modalBody.innerHTML = `
      ${mediaHTML}
      <div class="modal-title">${data.title || 'Sin título'}</div>
      <div class="modal-description">${data.description || 'Sin descripción'}</div>
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="modal-stat-value">${data.views || 0}</div>
          <div class="modal-stat-label">Visitas</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-value">${data.commentsCount || 0}</div>
          <div class="modal-stat-label">Comentarios</div>
        </div>
      </div>
      <div class="comments-section" id="commentsSection"></div>
    `;
    
    // Cargar comentarios
    await loadComments(mediaId);
    
    detailModal.classList.add("active");
  } catch (error) {
    showAlert("Error al cargar detalles: " + error.message, "error");
  }
};

// Ver solo comentarios
window.viewComments = async (mediaId) => {
  try {
    const docRef = doc(db, "media", mediaId);
    const docSnap = await getDoc(docRef);
    
    if (!docSnap.exists()) {
      showAlert("Contenido no encontrado", "error");
      return;
    }
    
    const data = docSnap.data();
    
    const modalBody = document.getElementById("modalBody");
    modalBody.innerHTML = `
      <div class="modal-title">💬 Comentarios: ${data.title || 'Sin título'}</div>
      <div class="comments-section" id="commentsSection"></div>
    `;
    
    // Cargar comentarios
    await loadComments(mediaId);
    
    detailModal.classList.add("active");
  } catch (error) {
    showAlert("Error al cargar comentarios: " + error.message, "error");
  }
};

// Cargar comentarios
async function loadComments(mediaId) {
  try {
    const response = await fetch(`/api/comments/${mediaId}`);
    const result = await response.json();
    
    const commentsSection = document.getElementById("commentsSection");
    
    let html = `
      <h3>Comentarios</h3>
      <div class="comment-form">
        <input type="text" id="commentName" placeholder="Tu nombre" value="Anónimo">
        <textarea id="commentText" placeholder="Escribe tu comentario..."></textarea>
        <button onclick="submitComment('${mediaId}')">Enviar Comentario</button>
      </div>
    `;
    
    if (result.ok && result.comments && result.comments.length > 0) {
      html += '<div class="comments-list">';
      result.comments.forEach(comment => {
        const date = new Date(comment.createdAt).toLocaleDateString('es-ES');
        html += `
          <div class="comment">
            <div class="comment-author">${comment.userName || 'Anónimo'}</div>
            <div class="comment-text">${comment.text}</div>
            <div class="comment-date">${date}</div>
          </div>
        `;
      });
      html += '</div>';
    } else {
      html += '<div class="empty-message">No hay comentarios aún. ¡Sé el primero!</div>';
    }
    
    commentsSection.innerHTML = html;
  } catch (error) {
    showAlert("Error al cargar comentarios: " + error.message, "error");
  }
}

// Enviar comentario
window.submitComment = async (mediaId) => {
  const name = document.getElementById("commentName").value || "Anónimo";
  const text = document.getElementById("commentText").value.trim();
  
  if (!text) {
    showAlert("Por favor escribe un comentario", "error");
    return;
  }
  
  try {
    const response = await fetch("/api/add-comment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mediaId,
        userId,
        userName: name,
        text
      })
    });
    
    if (response.ok) {
      showAlert("Comentario añadido exitosamente", "success");
      document.getElementById("commentText").value = "";
      await loadComments(mediaId);
    } else {
      showAlert("Error al añadir comentario", "error");
    }
  } catch (error) {
    showAlert("Error: " + error.message, "error");
  }
};

// Cerrar modal
window.closeModal = () => {
  detailModal.classList.remove("active");
};

// Cerrar modal al hacer click fuera
detailModal.addEventListener("click", (e) => {
  if (e.target === detailModal) {
    closeModal();
  }
});

// Cargar galería al iniciar
loadPublicGallery();

// Recargar cada 10 segundos
setInterval(loadPublicGallery, 10000);

</script>

</body>
</html>
