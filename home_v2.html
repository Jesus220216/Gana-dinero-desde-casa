<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Pública - Plataforma de Monetización</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .header h1 {
      font-size: 28px;
      color: #a855f7;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
    }

    .btn-secondary {
      background: rgba(168, 85, 247, 0.2);
      color: #a855f7;
      border: 1px solid #a855f7;
    }

    .btn-secondary:hover {
      background: rgba(168, 85, 247, 0.3);
    }

    .gallery-section h2 {
      margin-bottom: 20px;
      color: #a855f7;
      font-size: 24px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .gallery-item {
      border-radius: 12px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
    }

    .gallery-item img,
    .gallery-item video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .gallery-item-info {
      padding: 15px;
    }

    .gallery-item-title {
      font-weight: bold;
      color: #a855f7;
      margin-bottom: 5px;
    }

    .gallery-item-creator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #cbd5e1;
      text-decoration: none;
    }

    .gallery-item-creator:hover {
      color: #a855f7;
    }

    .creator-avatar-mini {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.3);
      object-fit: cover;
    }

    .gallery-item-stats {
      font-size: 12px;
      color: #cbd5e1;
    }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: #cbd5e1;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(168, 85, 247, 0.3);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #ef4444;
      cursor: pointer;
      background: none;
      border: none;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #a855f7;
      margin-bottom: 10px;
    }

    .modal-media {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .header-actions {
        width: 100%;
        flex-direction: column;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎬 Galería Pública</h1>
    <div class="header-actions">
      <a href="channels.html" class="btn btn-secondary">📺 Canales</a>
      <a href="dashboard_v2.html" class="btn btn-primary">📊 Mi Dashboard</a>
    </div>
  </div>

  <div class="gallery-section">
    <h2>📸 Contenido Destacado</h2>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Cargando contenido...</p>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="empty-message" id="emptyMessage" style="display:none;">
      <p>No hay contenido disponible en este momento.</p>
    </div>
  </div>

</div>

<div class="modal" id="detailModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgJITFOGXw-r5KYzz1zHlNz1jKw-_XMwM",
  authDomain: "monetizacion-pro.firebaseapp.com",
  projectId: "monetizacion-pro",
  storageBucket: "monetizacion-pro.appspot.com",
  messagingSenderId: "580361577178",
  appId: "1:580361577178:web:b86b0a8301e94b93997be3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const gallery = document.getElementById("gallery");
const loading = document.getElementById("loading");
const emptyMessage = document.getElementById("emptyMessage");
const detailModal = document.getElementById("detailModal");

let currentUser = null;

async function loadPublicMedia() {
  loading.style.display = "block";
  gallery.innerHTML = "";

  try {
    const response = await fetch("/api/media-public");
    const data = await response.json();

    if (!data.ok || data.media.length === 0) {
      emptyMessage.style.display = "block";
    } else {
      emptyMessage.style.display = "none";
      for (const media of data.media) {
        const item = document.createElement("div");
        item.className = "gallery-item";
        
        // Cargar info del creador
        let creatorName = "Creador";
        let creatorPhoto = "";
        try {
          const profRes = await fetch(`/api/user-profile/${media.uploadedBy}`);
          const profData = await profRes.json();
          if (profData.ok) {
            creatorName = profData.profile.displayName || "Creador";
            creatorPhoto = profData.profile.photoURL || "";
          }
        } catch (e) {}

        const mediaHtml = media.type.startsWith("image") 
          ? `<img src="${media.url}" alt="${media.title}" onclick="showDetail(${JSON.stringify(media).replace(/"/g, '&quot;')})">`
          : `<video src="${media.url}" onclick="showDetail(${JSON.stringify(media).replace(/"/g, '&quot;')})"></video>`;

        item.innerHTML = `
          ${mediaHtml}
          <div class="gallery-item-info">
            <div class="gallery-item-title">${media.title}</div>
            <a href="channel.html?id=${media.uploadedBy}" class="gallery-item-creator">
              ${creatorPhoto ? `<img src="${creatorPhoto}" class="creator-avatar-mini">` : `<span class="creator-avatar-mini" style="display:flex;align-items:center;justify-content:center;font-size:10px;">👤</span>`}
              <span>${creatorName}</span>
            </a>
            <div class="gallery-item-stats">👁️ ${media.views || 0} vistas • 💬 ${media.comments || 0}</div>
          </div>
        `;

        gallery.appendChild(item);
      }
    }
  } catch (error) {
    console.error(error);
    emptyMessage.style.display = "block";
    emptyMessage.textContent = "Error al cargar contenido";
  } finally {
    loading.style.display = "none";
  }
}

window.showDetail = (media) => {
  const modalBody = document.getElementById("modalBody");
  const mediaElement = media.type.startsWith("image") 
    ? `<img src="${media.url}" class="modal-media" alt="${media.title}">`
    : `<video src="${media.url}" class="modal-media" controls></video>`;

  modalBody.innerHTML = `
    ${mediaElement}
    <div class="modal-title">${media.title}</div>
    <div style="color: #cbd5e1; margin-bottom: 15px; line-height: 1.6;">${media.description || "Sin descripción"}</div>
    <div style="display: flex; gap: 20px; padding: 15px; background: rgba(168, 85, 247, 0.1); border-radius: 8px;">
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; color: #a855f7;">${media.views || 0}</div>
        <div style="font-size: 12px; color: #cbd5e1;">Vistas</div>
      </div>
      <div style="text-align: center;">
        <div style="font-size: 18px; font-weight: bold; color: #a855f7;">${media.comments || 0}</div>
        <div style="font-size: 12px; color: #cbd5e1;">Comentarios</div>
      </div>
    </div>
    <button class="btn btn-secondary" onclick="closeModal()" style="width: 100%; margin-top: 15px;">Cerrar</button>
  `;
  detailModal.classList.add("active");
};

window.closeModal = () => {
  detailModal.classList.remove("active");
};

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  loadPublicMedia();
});
</script>

</body>
</html>
