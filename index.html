<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Clone - Plataforma de Monetización</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 100;
      height: 50px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      gap: 10px;
    }

    .header-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* FEED CONTAINER */
    .feed-container {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      position: relative;
    }

    .feed-container::-webkit-scrollbar {
      width: 4px;
    }

    .feed-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .feed-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    /* POST CARD */
    .post-card {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 50px - 60px);
      scroll-snap-align: start;
      display: flex;
      position: relative;
      background: #000;
    }

    .post-media {
      flex: 1;
      width: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .post-media img,
    .post-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* POST CONTENT OVERLAY */
    .post-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      padding: 40px 16px 16px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 10;
    }

    .post-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .creator-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      object-fit: cover;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .creator-avatar:hover {
      transform: scale(1.1);
    }

    .creator-info {
      flex: 1;
      min-width: 0;
    }

    .creator-name {
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      color: white;
      transition: color 0.3s ease;
      display: block;
      text-decoration: none;
    }

    .creator-name:hover {
      color: #667eea;
    }

    .creator-bio {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    .follow-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .follow-btn.follow {
      background: #fff;
      color: #000;
    }

    .follow-btn.follow:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    .follow-btn.following {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .follow-btn.following:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .post-text {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 12px;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .post-music {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    /* SIDE ACTIONS */
    .side-actions {
      position: absolute;
      right: 12px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 20;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .action-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .action-btn:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.1);
    }

    .action-btn.liked {
      color: #ff1744;
    }

    .action-count {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      min-width: 30px;
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 60px;
      position: sticky;
      bottom: 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      height: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      border: none;
      background: none;
      font-size: 12px;
    }

    .nav-item:hover,
    .nav-item.active {
      color: white;
    }

    .nav-item.active {
      color: #667eea;
    }

    .nav-icon {
      font-size: 24px;
    }

    /* LOADING */
    .loading {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(102, 126, 234, 0.3);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
    }

    /* MODALS */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      align-items: flex-end;
      justify-content: center;
      animation: slideUp 0.3s ease;
    }

    .modal.active {
      display: flex;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-content {
      background: rgba(20, 20, 30, 0.95);
      border-radius: 12px 12px 0 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-close {
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    /* COMMENTS */
    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      object-fit: cover;
      flex-shrink: 0;
    }

    .comment-content {
      flex: 1;
      min-width: 0;
    }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .comment-name {
      font-weight: 600;
      font-size: 13px;
    }

    .comment-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    .comment-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.4;
    }

    .comment-input-area {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .comment-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 10px 16px;
      color: white;
      font-size: 13px;
    }

    .comment-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .comment-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      border-color: #667eea;
    }

    .comment-submit {
      background: #667eea;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .comment-submit:hover {
      background: #764ba2;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .post-content {
        padding: 30px 12px 12px;
        min-height: 150px;
      }

      .side-actions {
        right: 8px;
        bottom: 80px;
        gap: 12px;
      }

      .action-btn {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="app-container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-title">🎬 Para Ti</div>
    <div class="header-right">
      <button class="header-btn" onclick="alert('Búsqueda próximamente')">🔍</button>
      <button class="header-btn" onclick="alert('Notificaciones próximamente')">🔔</button>
    </div>
  </div>

  <!-- FEED -->
  <div class="feed-container" id="feedContainer">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Cargando videos...</p>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active" id="navFeed" onclick="navigateTo('feed', event)">
      <div class="nav-icon">🏠</div>
      <div>Para Ti</div>
    </a>
    <a href="#" class="nav-item" id="navExplore" onclick="navigateTo('explore', event)">
      <div class="nav-icon">🔎</div>
      <div>Explorar</div>
    </a>
    <a href="#" class="nav-item" id="navCreate" onclick="navigateTo('create', event)">
      <div class="nav-icon">➕</div>
      <div>Crear</div>
    </a>
    <a href="#" class="nav-item" id="navMessages" onclick="navigateTo('messages', event)">
      <div class="nav-icon">💬</div>
      <div>Mensajes</div>
    </a>
    <a href="#" class="nav-item" id="navProfile" onclick="navigateTo('profile', event)">
      <div class="nav-icon">👤</div>
      <div>Perfil</div>
    </a>
  </div>
</div>

<!-- COMMENTS MODAL -->
<div class="modal" id="commentsModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Comentarios</div>
      <button class="modal-close" onclick="closeModal('commentsModal')">&times;</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input-area">
      <input type="text" class="comment-input" id="commentInput" placeholder="Añade un comentario...">
      <button class="comment-submit" onclick="submitComment()">➤</button>
    </div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Perfil</div>
      <button class="modal-close" onclick="closeModal('profileModal')">&times;</button>
    </div>
    <div id="profileContent"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgJITFOGXw-r5KYzz1zHlNz1jKw-_XMwM",
  authDomain: "monetizacion-pro.firebaseapp.com",
  projectId: "monetizacion-pro",
  storageBucket: "monetizacion-pro.appspot.com",
  messagingSenderId: "580361577178",
  appId: "1:580361577178:web:b86b0a8301e94b93997be3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let currentUser = null;
let currentMedia = [];
let currentMediaIndex = 0;
let currentMediaId = null;

// Obtener publicaciones públicas
async function loadPublicMedia() {
  const loading = document.getElementById("loading");
  const feedContainer = document.getElementById("feedContainer");
  loading.style.display = "flex";
  feedContainer.innerHTML = "";

  try {
    const response = await fetch("/api/media-public");
    const data = await response.json();

    if (!data.ok || data.media.length === 0) {
      feedContainer.innerHTML = `
        <div class="empty-state">
          <div style="font-size: 60px; opacity: 0.5;">📭</div>
          <p>No hay publicaciones disponibles</p>
        </div>
      `;
      loading.style.display = "none";
      return;
    }

    currentMedia = data.media;
    loading.style.display = "none";
    renderPost(0);
  } catch (error) {
    console.error(error);
    feedContainer.innerHTML = `
      <div class="empty-state">
        <div style="font-size: 60px; opacity: 0.5;">⚠️</div>
        <p>Error al cargar publicaciones</p>
      </div>
    `;
    loading.style.display = "none";
  }
}

// Renderizar una publicación
async function renderPost(index) {
  if (index < 0 || index >= currentMedia.length) return;

  currentMediaIndex = index;
  const media = currentMedia[index];
  currentMediaId = media.id;

  const feedContainer = document.getElementById("feedContainer");
  
  // Obtener info del creador
  let creatorName = "Creador";
  let creatorPhoto = "";
  let creatorBio = "";

  try {
    const profRes = await fetch(`/api/user-profile/${media.uploadedBy}`);
    const profData = await profRes.json();
    if (profData.ok) {
      creatorName = profData.profile.displayName || "Creador";
      creatorPhoto = profData.profile.photoURL || "";
      creatorBio = profData.profile.bio || "";
    }
  } catch (e) {}

  // Obtener likes
  let likesCount = 0;
  let hasLiked = false;
  try {
    const likesRes = await fetch(`/api/likes/${media.id}`);
    const likesData = await likesRes.json();
    if (likesData.ok) {
      likesCount = likesData.count;
      if (currentUser) {
        const hasLikedRes = await fetch(`/api/has-liked/${media.id}/${currentUser.uid}`);
        const hasLikedData = await hasLikedRes.json();
        hasLiked = hasLikedData.hasLiked;
      }
    }
  } catch (e) {}

  const mediaElement = media.type.startsWith("image")
    ? `<img src="${media.url}" alt="${media.title}">`
    : `<video src="${media.url}" controls></video>`;

  const postCard = document.createElement("div");
  postCard.className = "post-card";
  postCard.innerHTML = `
    <div class="post-media">
      ${mediaElement}
      <div class="post-content">
        <div class="post-header">
          <img src="${creatorPhoto || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%23667eea%22/%3E%3C/svg%3E'}" class="creator-avatar" alt="${creatorName}" onclick="showCreatorProfile('${media.uploadedBy}')">
          <div class="creator-info">
            <a href="#" class="creator-name" onclick="showCreatorProfile('${media.uploadedBy}', event)">${creatorName}</a>
            <div class="creator-bio">${creatorBio}</div>
          </div>
          <button class="follow-btn follow" onclick="toggleFollow('${media.uploadedBy}', this)">+ Seguir</button>
        </div>
        <div class="post-text">${media.description || media.title}</div>
        <div class="post-music">🎵 Sonido original - ${creatorName}</div>
      </div>
      <div class="side-actions">
        <div class="action-item">
          <button class="action-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLike('${media.id}', this)">❤️</button>
          <div class="action-count">${likesCount}</div>
        </div>
        <div class="action-item">
          <button class="action-btn" onclick="openComments('${media.id}')">💬</button>
          <div class="action-count">${media.comments || 0}</div>
        </div>
        <div class="action-item">
          <button class="action-btn" onclick="sharePost('${media.id}')">📤</button>
          <div class="action-count">Compartir</div>
        </div>
      </div>
    </div>
  `;

  feedContainer.innerHTML = "";
  feedContainer.appendChild(postCard);

  // Registrar visita
  setTimeout(() => {
    fetch('/api/increment-views', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mediaId: media.id })
    }).catch(e => console.error('Error registrando visita:', e));
  }, 500);
}

// Toggle Like
window.toggleLike = async (mediaId, btn) => {
  if (!currentUser) {
    alert("Debes iniciar sesión para dar like");
    return;
  }

  const hasLiked = btn.classList.contains('liked');
  
  try {
    if (hasLiked) {
      await fetch('/api/unlike-media', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mediaId, userId: currentUser.uid })
      });
      btn.classList.remove('liked');
    } else {
      await fetch('/api/like-media', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mediaId, userId: currentUser.uid })
      });
      btn.classList.add('liked');
    }
    
    // Actualizar contador
    const likesRes = await fetch(`/api/likes/${mediaId}`);
    const likesData = await likesRes.json();
    btn.parentElement.querySelector('.action-count').textContent = likesData.count;
  } catch (e) {
    console.error('Error:', e);
  }
};

// Toggle Follow
window.toggleFollow = async (creatorId, btn) => {
  if (!currentUser) {
    alert("Debes iniciar sesión para seguir creadores");
    return;
  }

  try {
    const isFollowing = btn.classList.contains('following');
    
    if (isFollowing) {
      await fetch('/api/unfollow', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.uid, creatorId })
      });
      btn.classList.remove('following');
      btn.textContent = '+ Seguir';
    } else {
      await fetch('/api/follow', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.uid, creatorId })
      });
      btn.classList.add('following');
      btn.textContent = '✓ Siguiendo';
    }
  } catch (e) {
    console.error('Error:', e);
  }
};

// Abrir comentarios
window.openComments = async (mediaId) => {
  currentMediaId = mediaId;
  const modal = document.getElementById('commentsModal');
  const commentsList = document.getElementById('commentsList');

  try {
    const response = await fetch(`/api/comments/${mediaId}`);
    const data = await response.json();

    commentsList.innerHTML = '';
    
    if (data.ok && data.comments.length > 0) {
      for (const comment of data.comments) {
        const commentEl = document.createElement('div');
        commentEl.className = 'comment-item';
        commentEl.innerHTML = `
          <img src="${comment.userPhoto || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%23667eea%22/%3E%3C/svg%3E'}" class="comment-avatar" alt="${comment.userName}">
          <div class="comment-content">
            <div class="comment-header">
              <span class="comment-name">${comment.userName}</span>
              <span class="comment-time">hace poco</span>
            </div>
            <div class="comment-text">${comment.text}</div>
          </div>
        `;
        commentsList.appendChild(commentEl);
      }
    } else {
      commentsList.innerHTML = '<p style="text-align: center; color: rgba(255, 255, 255, 0.5);">Sin comentarios aún</p>';
    }
  } catch (e) {
    console.error('Error:', e);
  }

  modal.classList.add('active');
};

// Enviar comentario
window.submitComment = async () => {
  if (!currentUser) {
    alert("Debes iniciar sesión para comentar");
    return;
  }

  const input = document.getElementById('commentInput');
  const text = input.value.trim();

  if (!text) return;

  try {
    await fetch('/api/add-comment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mediaId: currentMediaId,
        userId: currentUser.uid,
        text
      })
    });

    input.value = '';
    await openComments(currentMediaId);
  } catch (e) {
    console.error('Error:', e);
  }
};

// Mostrar perfil del creador
window.showCreatorProfile = async (creatorId, event) => {
  if (event) event.preventDefault();

  try {
    const profRes = await fetch(`/api/user-profile/${creatorId}`);
    const profData = await profRes.json();

    const statsRes = await fetch(`/api/user-stats/${creatorId}`);
    const statsData = await statsRes.json();

    if (profData.ok && statsData.ok) {
      const profile = profData.profile;
      const stats = statsData.stats;

      const profileContent = document.getElementById('profileContent');
      profileContent.innerHTML = `
        <div style="text-align: center; padding: 20px 0;">
          <img src="${profile.photoURL || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%23667eea%22/%3E%3C/svg%3E'}" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px; display: block;">
          <div style="font-size: 20px; font-weight: 700; margin-bottom: 5px;">${profile.displayName || 'Creador'}</div>
          <div style="font-size: 14px; color: rgba(255, 255, 255, 0.7); margin-bottom: 15px;">@${creatorId}</div>
          <div style="font-size: 14px; color: rgba(255, 255, 255, 0.8); margin-bottom: 20px;">${profile.bio || 'Sin descripción'}</div>
          
          <div style="display: flex; justify-content: center; gap: 30px; margin: 20px 0; padding: 15px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
            <div style="text-align: center;">
              <div style="font-size: 18px; font-weight: 700; color: #667eea;">${stats.subscribers || 0}</div>
              <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 5px;">Seguidores</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: 18px; font-weight: 700; color: #667eea;">${stats.totalViews || 0}</div>
              <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 5px;">Vistas</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: 18px; font-weight: 700; color: #667eea;">${(stats.balance || 0).toFixed(2)}</div>
              <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 5px;">Balance</div>
            </div>
          </div>

          <button class="follow-btn follow" style="width: 100%; padding: 12px; margin-bottom: 20px;" onclick="toggleFollowFromModal('${creatorId}', this)">+ Seguir</button>

          <a href="profile.html?id=${creatorId}" style="display: block; padding: 12px; background: rgba(102, 126, 234, 0.2); border-radius: 8px; color: #667eea; text-decoration: none; font-weight: 600; margin-bottom: 10px;">Ver perfil completo →</a>

          ${profile.website ? `<p style="margin-top: 15px; font-size: 14px;"><a href="${profile.website}" target="_blank" style="color: #667eea; text-decoration: none;">🌐 ${profile.website}</a></p>` : ''}
          ${profile.telegram ? `<p style="font-size: 14px;"><a href="https://t.me/${profile.telegram}" target="_blank" style="color: #667eea; text-decoration: none;">📱 Telegram</a></p>` : ''}
          ${profile.whatsapp ? `<p style="font-size: 14px;"><a href="https://wa.me/${profile.whatsapp}" target="_blank" style="color: #667eea; text-decoration: none;">💬 WhatsApp</a></p>` : ''}
        </div>
      `;
      
      document.getElementById('profileModal').classList.add('active');
    }
  } catch (error) {
    console.error("Error cargando perfil:", error);
  }
};

// Toggle Follow desde modal
window.toggleFollowFromModal = async (creatorId, btn) => {
  if (!currentUser) {
    alert("Debes iniciar sesión para seguir creadores");
    return;
  }

  try {
    const isFollowing = btn.classList.contains('following');
    
    if (isFollowing) {
      await fetch('/api/unfollow', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.uid, creatorId })
      });
      btn.classList.remove('following');
      btn.textContent = '+ Seguir';
    } else {
      await fetch('/api/follow', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.uid, creatorId })
      });
      btn.classList.add('following');
      btn.textContent = '✓ Siguiendo';
    }
  } catch (e) {
    console.error('Error:', e);
  }
};

// Compartir publicación
window.sharePost = (mediaId) => {
  const media = currentMedia.find(m => m.id === mediaId);
  if (media && navigator.share) {
    navigator.share({
      title: media.title,
      text: media.description,
      url: window.location.href
    });
  } else {
    alert("Compartir: " + media.title);
  }
};

// Cerrar modal
window.closeModal = (modalId) => {
  document.getElementById(modalId).classList.remove('active');
};

// Navegar entre secciones
window.navigateTo = (section, event) => {
  event.preventDefault();
  
  // Actualizar nav activo
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  event.target.closest('.nav-item').classList.add('active');

  switch(section) {
    case 'feed':
      loadPublicMedia();
      break;
    case 'explore':
      alert('Explorar próximamente');
      break;
    case 'create':
      window.location.href = 'dashboard_v2.html';
      break;
    case 'messages':
      alert('Mensajes próximamente');
      break;
    case 'profile':
      if (currentUser) {
        window.location.href = `profile.html?id=${currentUser.uid}`;
      } else {
        alert('Debes iniciar sesión');
      }
      break;
  }
};

// Cargar datos al iniciar
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  loadPublicMedia();
});

// Navegación con teclado
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    renderPost(currentMediaIndex - 1);
  } else if (e.key === 'ArrowDown') {
    renderPost(currentMediaIndex + 1);
  }
});
</script>

</body>
</html>
